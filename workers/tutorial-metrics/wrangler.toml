name = "dra9on-tutorial-metrics"
main = "src/index.mjs"
compatibility_date = "2026-10-17"
workers_dev = true
preview_urls = false
account_id = "f25bbc251a70676f521c097b1d047d95"

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "9707101"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "9707102"
simple = { limit = 120, period = 60 }

# Set the real account_id and D1 database_id during deployment. Never put API
# tokens in this file. Keep this Worker on the Workers Free plan.

[vars]
ALLOWED_ORIGINS = "https://dra9oncinema.com,https://www.dra9oncinema.com,https://dra9on-cinema.pages.dev"
MAX_DAILY_EVENTS = "20000"
OWNER_EMAIL_SHA256 = "21c4da72d4094fc9475701ec568ded4fc3d2852b0afe66e0f24fa498fc1b7453"

[[d1_databases]]
binding = "DB"
database_name = "dra9on-tutorial-metrics"
database_id = "03871554-f291-48eb-9d35-c27c78cf9f27"
migrations_dir = "migrations"

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false
