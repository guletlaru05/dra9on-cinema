<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude, MCP, Newtake: one brief, four shots</title>
  <desc id="desc">A workflow diagram, not generated video footage. Claude sends a brief through MCP to Newtake, producing a wide shot, a tracking shot, a close-up and an over-the-shoulder view of one protagonist looking out over the city.</desc>
