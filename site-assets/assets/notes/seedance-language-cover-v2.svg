<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202329"/><stop offset="1" stop-color="#0c0e12"/></linearGradient><clipPath id="photo"><rect x="910" y="130" width="570" height="520" rx="18"/></clipPath></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="86" y="98" font-family="sans-serif" font-size="20" fill="#d0b382" letter-spacing="5">SEEDANCE / LANGUAGE LAB</text><text x="86" y="182" font-family="sans-serif" font-size="66" font-weight="bold" fill="#f4f0e9">ONE SCENE. THREE PROMPTS.</text><text x="86" y="246" font-family="sans-serif" font-size="28" fill="#adb6c5">Keep the meaning. Change only the language.</text><rect x="86" y="315" width="446" height="378" rx="14" fill="#232831" stroke="#59616c"/><text x="114" y="398" fill="#d0b382" font-family="sans-serif" font-size="60" font-weight="bold">KO</text><text x="114" y="448" fill="#929faf" font-family="sans-serif" font-size="24">한국어</text><path d="M114 480H504" stroke="#46505d"/><text x="114" y="540" fill="#e4e4e4" font-family="sans-serif" font-size="24">시선이 먼저 움직인다.</text><text x="114" y="589" fill="#e4e4e4" font-family="sans-serif" font-size="24">고개가 천천히 따른다.</text><text x="114" y="638" fill="#e4e4e4" font-family="sans-serif" font-size="24">카메라는 느리게 전진한다.</text><rect x="568" y="315" width="446" height="378" rx="14" fill="#232831" stroke="#59616c"/><text x="596" y="398" fill="#d0b382" font-family="sans-serif" font-size="60" font-weight="bold">EN</text><text x="596" y="448" fill="#929faf" font-family="sans-serif" font-size="24">English</text><path d="M596 480H986" stroke="#46505d"/><text x="596" y="540" fill="#e4e4e4" font-family="sans-serif" font-size="24">Eyes move first.</text><text x="596" y="589" fill="#e4e4e4" font-family="sans-serif" font-size="24">The head follows slowly.</text><text x="596" y="638" fill="#e4e4e4" font-family="sans-serif" font-size="24">The camera dollies forward.</text><rect x="1050" y="315" width="446" height="378" rx="14" fill="#232831" stroke="#59616c"/><text x="1078" y="398" fill="#d0b382" font-family="sans-serif" font-size="60" font-weight="bold">中文</text><text x="1078" y="448" fill="#929faf" font-family="sans-serif" font-size="24">简体中文</text><path d="M1078 480H1468" stroke="#46505d"/><text x="1078" y="540" fill="#e4e4e4" font-family="sans-serif" font-size="24">先移动视线。</text><text x="1078" y="589" fill="#e4e4e4" font-family="sans-serif" font-size="24">头部缓慢跟随。</text><text x="1078" y="638" fill="#e4e4e4" font-family="sans-serif" font-size="24">摄影机缓慢向前移动。</text><text x="86" y="772" fill="#c7cdd7" font-family="sans-serif" font-size="25">SAME REFERENCE · SAME SETTINGS · COMPARE THE RESULTS</text><text x="800" y="450" text-anchor="middle" font-family="sans-serif" font-size="40" fill="white" opacity=".065" letter-spacing="8">DRA9ON CINEMA</text><text x="86" y="842" font-family="sans-serif" font-size="17" fill="#9299a6" letter-spacing="4">DRA9ON CINEMA / ORIGINAL LEARNING VISUAL</text></svg>