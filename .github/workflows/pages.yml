name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned PDF build dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Install pinned private reader dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/tutorial-metrics
      - name: Install pinned notification test dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/episode-push
      - name: Check synchronization, privacy and anonymous aggregate behavior
        run: |
          python3 -m unittest test_robots_policy test_youtube_sync test_youtube_site test_lounge
          node test-consent.cjs
          node test-continue-watching.cjs
          node --test test-tutorial-metrics.cjs workers/tutorial-metrics/test/worker.test.mjs
          node --test test-workspace.mjs test-workspace-auto.mjs workers/tutorial-metrics/test/private-reader.test.mjs
          python3 -m unittest test_tutorial_references
          node --test test-pwa.cjs test-pwa-ui.cjs workers/episode-push/test/push.test.mjs workers/episode-push/test/board.test.mjs
          node --test test-request-limits.mjs
      - name: Restore YouTube API snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/youtube-api.json
          key: youtube-api-v1-${{ github.run_id }}
          restore-keys: youtube-api-v1-
      - name: Refresh public YouTube metadata once daily
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 youtube_sync.py
      - name: Save YouTube API snapshot
        uses: actions/cache/save@v4
        with:
          path: .cache/youtube-api.json
          key: youtube-api-v1-${{ github.run_id }}
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Korean, English, Japanese and Spanish pages
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          D9_METRICS_ENDPOINT: ${{ vars.D9_METRICS_ENDPOINT }}
        run: python3 build-portfolio.py --origin "$SITE_ORIGIN" --base-path "$SITE_BASE_PATH"
      - name: Check links, translations, and metadata
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 verify-site.py --origin "$SITE_ORIGIN" --base-path "$SITE_BASE_PATH"
      - name: Verify translated routes and native still dimensions
        run: python3 -m unittest test_international test_aesthetics_tutorial test_lighting_tutorial test_tutorial_catalog test_tutorial_images test_pwa
      - name: Publish anonymous metrics registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Anonymous metrics deployment is not configured."
            exit 0
          fi
          npx --yes wrangler@4.151.1 d1 migrations apply dra9on-tutorial-metrics --remote --config workers/tutorial-metrics/wrangler.toml
          npx --yes wrangler@4.151.1 deploy --config workers/tutorial-metrics/wrangler.toml
          npx --yes wrangler@4.151.1 deploy --config workers/episode-push/wrangler.toml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  episode-notifications:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/episode-push
      - name: Announce only newly deployed episodes
        env:
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_PUBLIC_KEY: ${{ vars.PUSH_VAPID_PUBLIC_KEY }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node workers/episode-push/notify.mjs
