name: Verify Cloudflare production deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-preview-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the exact commit and four-language episode feed
        run: python3 scripts/check_cloudflare_deploy.py "$GITHUB_SHA" --attempts 20 --save-feed
      - run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/episode-push
      - name: Test notification feed without sending to any subscriber
        env:
          PUSH_DRY_RUN: 'true'
          PUSH_VERIFIED_FEED_FILE: 'true'
          PUSH_SITE_ORIGIN: ${{ vars.CF_SITE_ORIGIN || 'https://dra9oncinema.com' }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node workers/episode-push/notify.mjs
      - run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Check preview login isolation, visible failures and auth proxy
        run: |
          python3 -m unittest test_cloudflare_build test_preview_login
          node --test test-preview-login.mjs
      - name: Build the list of public pages and assets to verify
        env:
          SITE_ORIGIN: ${{ vars.CF_SITE_ORIGIN || 'https://dra9oncinema.com' }}
          D9_DEPLOYMENT_STAGE: ${{ vars.CF_DEPLOYMENT_STAGE || 'production' }}
        run: python3 scripts/build_cloudflare.py
      - name: Verify security headers, private metrics CSP and canonical auth isolation
        run: |
          python3 -m unittest test_cutover_security test_performance test_home_players test_seo test_casting test_social_cards
          node --test test-scroll-progress.cjs
      - name: Check every public production page and asset
        run: python3 scripts/verify_preview_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-live-verification-${{ github.run_id }}
          path: .cache/preview-live-verification.json
          retention-days: 7
