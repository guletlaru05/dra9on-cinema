name: Retry pending episode notifications
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dra9on-push-retry
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/episode-push
      - name: Verify the canonical deployed revision before reading its public feed
        run: python3 scripts/check_cloudflare_deploy.py "$GITHUB_SHA" --attempts 4 --save-feed
      - name: Sync the public deployed feed and retry pending delivery
        env:
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_PUBLIC_KEY: ${{ vars.PUSH_VAPID_PUBLIC_KEY }}
          EXPECTED_REVISION: ${{ github.sha }}
          PUSH_VERIFIED_FEED_FILE: 'true'
        run: node workers/episode-push/notify.mjs
